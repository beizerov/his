services:
  postgres:
    image: postgres:18
    container_name: his-postgres
    environment:
      POSTGRES_DB: patient-management-service-dev-db
      POSTGRES_USER: patient_management_service_dev_admin
      POSTGRES_PASSWORD: ${PATIENT_MANAGEMENT_SERVICE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: